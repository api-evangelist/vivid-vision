name: Vivid Vision
description: >-
  Vivid Vision is a digital vision care company that builds VR- and software-based
  tools for diagnosing and treating binocular vision disorders. Its products include
  a vision training system for amblyopia (lazy eye), strabismus, and convergence
  insufficiency; Vivid Vision Perimetry (VVP), a VR-based visual field test used as
  an endpoint in ophthalmology clinical trials for geographic atrophy, AMD, and
  glaucoma; and EYEBAB VT therapeutic exercises for clinical settings. Founded in
  2014, the platform has been used by more than 100,000 patients across 50+ countries
  through eye-care practices and clinics. Vivid Vision is backed by Uncork Capital.
  The company is a patient- and clinician-facing vision-care provider and does not
  publish a public developer API, SDK, or webhook surface at this time.
